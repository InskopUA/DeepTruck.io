<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Carrier Verification</title>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--faint:#94a3b8;--line:#e2e8f0;--line-dark:#cbd5e1;--blue:#2563eb;--blue-ink:#1e3a8a;--blue-soft:#eff6ff;--green:#047857;--green-soft:#ecfdf5;--red:#b42318}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 18%,rgba(37,99,235,.16),transparent 28%),linear-gradient(180deg,#fbfdff 0%,var(--bg) 100%);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.stage{display:grid;min-height:100vh;padding:28px 14px;place-items:center}.widget{background:var(--card);border:1px solid rgba(203,213,225,.9);border-radius:22px;box-shadow:0 30px 80px rgba(15,23,42,.14);max-width:430px;overflow:hidden;position:relative;width:100%}.accent{background:linear-gradient(90deg,#0f172a,#2563eb 48%,#93c5fd);height:4px}.header{align-items:flex-start;display:grid;gap:12px;grid-template-columns:38px 1fr auto;padding:22px 22px 18px}.mark{align-items:center;background:var(--ink);border-radius:12px;color:#fff;display:flex;font-size:12px;font-weight:780;height:38px;justify-content:center;letter-spacing:0;width:38px}.header p,h1,h2,.contact p,footer{margin:0}.header p{color:var(--blue);font-size:10px;font-weight:780;letter-spacing:0;margin:1px 0 5px;text-transform:uppercase}h1{font-size:21px;font-weight:760;letter-spacing:0;line-height:1.12}.status{background:var(--blue-soft);border:1px solid #bfdbfe;border-radius:999px;color:var(--blue-ink);font-size:11px;font-weight:720;line-height:1;padding:7px 9px}.status.done,.pill.done{background:var(--green-soft);border-color:#bbf7d0;color:var(--green)}.identity{display:grid;gap:10px;grid-template-columns:1fr 1fr;padding:0 22px 14px}.identity div{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:11px 12px}.identity span,.contact span{color:var(--faint);display:block;font-size:10px;font-weight:740;margin-bottom:4px}.identity strong,.contact b{color:var(--ink);display:block;font-size:14px;font-weight:740;overflow-wrap:anywhere}.contact{border-bottom:1px solid var(--line);display:grid;gap:10px;padding:0 22px 18px}.contact p{min-width:0}.form{display:grid}.row{display:grid;gap:12px;grid-template-columns:18px 1fr auto;padding:16px 22px}.row+.row{border-top:1px solid var(--line)}.state{padding-top:3px}.state span{background:#dbe3ef;border-radius:999px;display:block;height:8px;width:8px}.state.done span{background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}.row-main{min-width:0}h2{font-size:13px;font-weight:760;line-height:1.25}.row-main p{color:var(--muted);font-size:12px;line-height:1.42;margin:3px 0 0}button,.upload{align-items:center;background:#fff;border:1px solid var(--line-dark);border-radius:10px;color:#1e293b;cursor:pointer;display:inline-flex;font-size:12px;font-weight:720;height:32px;justify-content:center;padding:0 11px;white-space:nowrap}button:hover,.upload:hover{background:#f8fafc;border-color:#b8c5d6}button.done{background:var(--green-soft);border-color:#bbf7d0;color:var(--green)}.inline{align-items:center;display:flex;gap:8px;margin-top:9px}input:not([type]),input[type=text]{border:1px solid var(--line-dark);border-radius:10px;color:var(--ink);font:680 13px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;height:32px;padding:0 10px;width:112px}.upload input{height:1px;opacity:0;position:absolute;width:1px}.message{color:var(--red);font-size:11px;font-weight:680;margin-top:7px}footer{background:#fbfdff;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.4;padding:13px 22px 15px}@media(max-width:500px){.stage{place-items:start center}.header{grid-template-columns:38px 1fr}.status{grid-column:1/-1;justify-self:start}.row{grid-template-columns:18px 1fr}.row>button{grid-column:2;justify-self:start}.inline{align-items:stretch;display:grid;grid-template-columns:1fr auto}.identity{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="stage">
    <section class="widget">
      <div class="accent"></div>

      <header class="header">
        <div class="mark">DV</div>
        <div>
          <p>DeepTruck Verify</p>
          <h1 id="carrier-name">Carrier verification</h1>
        </div>
        <span id="status-pill" class="status">Loading</span>
      </header>

      <div class="identity">
        <div>
          <span>USDOT</span>
          <strong id="dot">-</strong>
        </div>
        <div>
          <span>MC</span>
          <strong id="mc">-</strong>
        </div>
      </div>

      <div class="contact">
        <p><span>Email</span><b id="email">-</b></p>
        <p><span>Phone</span><b id="phone">-</b></p>
      </div>

      <section class="form">
        <div class="row">
          <div id="email-check" class="state check"><span></span></div>
          <div class="row-main">
            <h2>Email confirmation</h2>
            <p>Confirm this verification request.</p>
          </div>
          <button id="verify-email">Confirm</button>
        </div>

        <div class="row">
          <div id="phone-check" class="state check"><span></span></div>
          <div class="row-main">
            <h2>SMS code</h2>
            <p id="phone-help">Enter the code sent to the carrier phone.</p>
            <div class="inline">
              <input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" maxlength="8">
              <button id="verify-phone">Verify</button>
            </div>
            <div id="phone-msg" class="message"></div>
          </div>
        </div>

        <div class="row">
          <div id="license-check" class="state check"><span></span></div>
          <div class="row-main">
            <h2>Driver license</h2>
            <p>Upload PDF, JPG, or PNG.</p>
            <div class="inline">
              <label class="upload">
                <input id="license" type="file" accept="image/*,.pdf">
                <span>Choose file</span>
              </label>
              <button id="upload-license">Upload</button>
            </div>
            <div id="license-msg" class="message"></div>
          </div>
        </div>
      </section>

      <footer>Required before load assignment.</footer>
    </section>
  </main>
  <script src="verify.js"></script>
</body>
</html>
