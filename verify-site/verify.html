<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Carrier Verification</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="verify">
      <header class="top">
        <div>
          <p class="brand">DeepTruck Verify</p>
          <h1 id="carrier-name">Carrier verification</h1>
        </div>
        <span id="status-pill" class="status">Loading</span>
      </header>

      <div class="meta">
        <p><span>USDOT</span> <b id="dot">-</b> <i></i> <span>MC</span> <b id="mc">-</b></p>
        <p><span>Email</span> <b id="email">-</b></p>
        <p><span>Phone</span> <b id="phone">-</b></p>
      </div>

      <div class="flow">
        <section class="item">
          <div id="email-check" class="marker check"><span></span></div>
          <div class="content">
            <div class="line">
              <div>
                <h2>Email</h2>
                <p>Confirm request receipt.</p>
              </div>
              <button id="verify-email">Confirm</button>
            </div>
          </div>
        </section>

        <section class="item">
          <div id="phone-check" class="marker check"><span></span></div>
          <div class="content">
            <div class="line">
              <div>
                <h2>SMS code</h2>
                <p id="phone-help">Enter the code sent to the carrier phone.</p>
              </div>
              <div class="control">
                <input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" maxlength="8">
                <button id="verify-phone">Verify</button>
              </div>
            </div>
            <div id="phone-msg" class="message"></div>
          </div>
        </section>

        <section class="item">
          <div id="license-check" class="marker check"><span></span></div>
          <div class="content">
            <div class="line">
              <div>
                <h2>Driver license</h2>
                <p>PDF, JPG or PNG.</p>
              </div>
              <div class="control">
                <label class="file">
                  <input id="license" type="file" accept="image/*,.pdf">
                  <span>Choose</span>
                </label>
                <button id="upload-license">Upload</button>
              </div>
            </div>
            <div id="license-msg" class="message"></div>
          </div>
        </section>
      </div>

      <footer>
        Verification is required before load assignment.
      </footer>
    </section>
  </main>
  <script src="verify.js"></script>
</body>
</html>
