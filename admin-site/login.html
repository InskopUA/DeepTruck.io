<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b0e">
  <title>Sign in · DeepTruck Verify</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body class="auth-page" data-auth-page="login">
  <main class="auth-layout">
    <a class="auth-logo" href="/" aria-label="DeepTruck Verify home"><img src="/shield-mark.svg" alt="" width="40" height="45"><span>DeepTruck <small>Verify</small></span></a>
    <section class="auth-card" aria-labelledby="auth-title">
      <h1 id="auth-title">Sign in</h1>
      <form id="auth-form">
        <label for="auth-email">Email address<input id="auth-email" name="email" type="email" autocomplete="email" required placeholder="you@company.com"></label>
        <label for="auth-password">Password
          <span class="password-field"><input id="auth-password" name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Enter your password"><button id="password-toggle" type="button" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></span>
        </label>
        <button id="auth-submit" class="primary auth-submit" type="submit" disabled>Sign in</button>
        <div id="auth-message" class="inline-message" role="status" aria-live="polite"></div>
      </form>
      <p class="auth-footer">New to DeepTruck? <a href="/signup">Create an account</a></p>
    </section>
    <a class="auth-home" href="/">← Back to website</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/admin/auth-client.js"></script>
  <script src="/admin/auth.js"></script>
</body>
</html>
