<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b0e">
  <script src="/theme.js"></script>
  <title>Create your account · DeepTruck Verify</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin/styles.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/admin/auth-theme.css">
</head>
<body class="auth-page" data-auth-page="signup">
  <main class="auth-layout">
    <a class="auth-logo" href="/" aria-label="DeepTruck Verify home"><img data-theme-logo src="/shield-mark.svg" alt="" width="40" height="45"><span>DeepTruck <small>Verify</small></span></a>
    <section class="auth-card" aria-labelledby="auth-title">
      <h1 id="auth-title">Create your account</h1>
      <form id="auth-form">
        <div class="form-row">
          <label for="first-name">First name<input id="first-name" name="first_name" autocomplete="given-name" required maxlength="80" placeholder="First name"></label>
          <label for="last-name">Last name<input id="last-name" name="last_name" autocomplete="family-name" required maxlength="80" placeholder="Last name"></label>
        </div>
        <label for="company-name">Company name<input id="company-name" name="company_name" autocomplete="organization" required maxlength="120" placeholder="Your company"></label>
        <label for="auth-email">Email address<input id="auth-email" name="email" type="email" autocomplete="email" required placeholder="you@company.com"></label>
        <label for="auth-password">Password
          <span class="password-field"><input id="auth-password" name="password" type="password" autocomplete="new-password" required minlength="6" placeholder="At least 6 characters"><button id="password-toggle" type="button" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></span>
        </label>
        <button id="auth-submit" class="primary auth-submit" type="submit" disabled>Create account</button>
        <div id="auth-message" class="inline-message" role="status" aria-live="polite"></div>
      </form>
      <p class="auth-footer">Already have an account? <a href="/login">Sign in</a></p>
    </section>
    <a class="auth-home" href="/">← Back to website</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/admin/auth-client.js"></script>
  <script src="/admin/auth.js"></script>
</body>
</html>
