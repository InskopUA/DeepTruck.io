<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CarrierVerify Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <h1>CarrierVerify Settings</h1>
      <p>Sign in with the same account you use in the DeepTruck shipper console.</p>
    </header>

    <section>
      <h2>Account</h2>
      <form id="login-form">
        <label>
          Email
          <input id="loginEmail" type="email" autocomplete="email" placeholder="you@company.com">
        </label>
        <label>
          Password
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password">
        </label>
        <button id="login-button" type="submit">Login</button>
        <button id="logout-button" class="secondary" type="button">Logout</button>
        <span id="auth-status"></span>
      </form>
    </section>

    <form id="settings-form">
      <h2>Developer settings</h2>
      <label>
        Verification API base URL
        <input id="apiBaseUrl" placeholder="https://yqpeebgmqtqoxumzfrsq.supabase.co/functions/v1/carrier-verify">
      </label>
      <label>
        API key override
        <input id="apiKey" type="password" placeholder="Optional bearer token">
      </label>
      <button>Save settings</button>
      <span id="status"></span>
    </form>

    <section>
      <h2>Expected endpoints</h2>
      <code>POST /verification-requests</code>
      <code>GET /verification-requests/:id</code>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
