<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CarrierVerify</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1>CarrierVerify</h1>
      <p>Sign in once, then open a Central Dispatch carrier profile.</p>
    </header>

    <form id="login-form">
      <label>
        Email
        <input id="loginEmail" type="email" autocomplete="email" placeholder="you@company.com">
      </label>
      <label>
        Password
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password">
      </label>
      <button id="login-button" type="submit">Login</button>
      <button id="logout-button" class="secondary" type="button">Logout</button>
      <span id="auth-status"></span>
    </form>
  </main>
  <script src="account.js"></script>
</body>
</html>
