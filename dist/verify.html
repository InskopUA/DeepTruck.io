<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Carrier Verification</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="card">
      <header class="head">
        <div>
          <p class="brand">DeepTruck Verify</p>
          <h1 id="carrier-name">Carrier verification</h1>
        </div>
        <span id="status-pill" class="pill">Loading</span>
      </header>

      <div class="meta">
        <div><span>USDOT</span><b id="dot">-</b></div>
        <div><span>MC</span><b id="mc">-</b></div>
        <div><span>Email</span><b id="email">-</b></div>
        <div><span>Phone</span><b id="phone">-</b></div>
      </div>

      <div class="progress">
        <div id="email-check" class="check"><span></span>Email</div>
        <div id="phone-check" class="check"><span></span>SMS</div>
        <div id="license-check" class="check"><span></span>License</div>
      </div>

      <div class="steps">
        <div class="step">
          <div class="copy">
            <h2>Email</h2>
            <p>Confirm this request was received at the listed carrier email.</p>
          </div>
          <button id="verify-email">Verify</button>
        </div>

        <div class="step">
          <div class="copy">
            <h2>Phone</h2>
            <p id="phone-help">Enter the SMS code sent to the carrier phone.</p>
            <input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" maxlength="8">
            <div id="phone-msg" class="message"></div>
          </div>
          <button id="verify-phone">Verify</button>
        </div>

        <div class="step">
          <div class="copy">
            <h2>Driver license</h2>
            <p>Upload the license for the driver transporting the vehicle.</p>
            <label class="filebox">
              <input id="license" type="file" accept="image/*,.pdf">
              <span>Select file</span>
            </label>
            <div id="license-msg" class="message"></div>
          </div>
          <button id="upload-license">Upload</button>
        </div>
      </div>
    </section>
  </main>
  <script src="verify.js"></script>
</body>
</html>
