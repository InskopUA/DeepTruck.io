<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Carrier Verification</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <section class="verify">
      <header class="top">
        <div>
          <p class="brand">DeepTruck Verify</p>
          <h1 id="carrier-name">Carrier verification</h1>
        </div>
        <span id="status-pill" class="status">Loading</span>
      </header>

      <div class="meta">
        <span>USDOT <b id="dot">-</b></span>
        <span>MC <b id="mc">-</b></span>
        <span class="wide">Email <b id="email">-</b></span>
        <span class="wide">Phone <b id="phone">-</b></span>
      </div>

      <section class="flow">
        <div class="step">
          <div id="email-check" class="dot check"><span></span></div>
          <div class="copy">
            <h2>Email confirmation</h2>
            <p>Confirmed automatically when this page opens.</p>
          </div>
          <button id="verify-email" type="button">Verified</button>
        </div>

        <div class="step">
          <div id="phone-check" class="dot check"><span></span></div>
          <div class="copy">
            <h2>SMS code</h2>
            <p id="phone-help">Enter the code sent to the carrier phone.</p>
            <div id="phone-msg" class="message"></div>
          </div>
          <div class="action code-action">
            <input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" maxlength="8">
            <button id="verify-phone">Verify</button>
          </div>
        </div>

        <div class="step">
          <div id="license-check" class="dot check"><span></span></div>
          <div class="copy">
            <h2>Driver license</h2>
            <p>PDF, JPG, or PNG.</p>
            <div id="license-msg" class="message"></div>
          </div>
          <div class="action license-action">
            <label id="upload-license" class="file-control">
              <input id="license" type="file" accept="image/*,.pdf">
              <span id="license-label">Upload license</span>
            </label>
          </div>
        </div>

        <div class="step">
          <div id="w9-check" class="dot check"><span></span></div>
          <div class="copy">
            <h2>W-9</h2>
            <p>Signed W-9 document.</p>
            <div id="w9-msg" class="message"></div>
          </div>
          <div class="action document-action">
            <label id="upload-w9" class="file-control">
              <input id="w9" type="file" accept="image/*,.pdf">
              <span id="w9-label">Upload W-9</span>
            </label>
          </div>
        </div>

        <div class="step">
          <div id="coi-check" class="dot check"><span></span></div>
          <div class="copy">
            <h2>COI</h2>
            <p>Certificate of insurance.</p>
            <div id="coi-msg" class="message"></div>
          </div>
          <div class="action document-action">
            <label id="upload-coi" class="file-control">
              <input id="coi" type="file" accept="image/*,.pdf">
              <span id="coi-label">Upload COI</span>
            </label>
          </div>
        </div>
      </section>
    </section>
  </main>
  <script src="verify.js"></script>
</body>
</html>
