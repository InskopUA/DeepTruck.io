<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Carrier Verification</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="verify-card">
      <header class="hero">
        <div>
          <p class="brand">DeepTruck Verify</p>
          <h1 id="carrier-name">Carrier verification</h1>
        </div>
        <span id="status-pill" class="status">Loading</span>
      </header>

      <dl class="carrier-meta">
        <div><dt>USDOT</dt><dd id="dot">-</dd></div>
        <div><dt>MC</dt><dd id="mc">-</dd></div>
        <div><dt>Email</dt><dd id="email">-</dd></div>
        <div><dt>Phone</dt><dd id="phone">-</dd></div>
      </dl>

      <div class="track">
        <div id="email-check" class="check"><span></span>Email</div>
        <div id="phone-check" class="check"><span></span>SMS</div>
        <div id="license-check" class="check"><span></span>License</div>
      </div>

      <div class="flow">
        <section class="task">
          <div class="task-copy">
            <span class="step">01</span>
            <div>
              <h2>Email</h2>
              <p>Confirm this request.</p>
            </div>
          </div>
          <button id="verify-email">Confirm</button>
        </section>

        <section class="task">
          <div class="task-copy">
            <span class="step">02</span>
            <div>
              <h2>SMS</h2>
              <p id="phone-help">Enter the code sent to the carrier phone.</p>
              <input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" maxlength="8">
              <div id="phone-msg" class="message"></div>
            </div>
          </div>
          <button id="verify-phone">Confirm</button>
        </section>

        <section class="task">
          <div class="task-copy">
            <span class="step">03</span>
            <div>
              <h2>License</h2>
              <p>Upload the driver's license.</p>
              <label class="file-select">
                <input id="license" type="file" accept="image/*,.pdf">
                <span>Select file</span>
              </label>
              <div id="license-msg" class="message"></div>
            </div>
          </div>
          <button id="upload-license">Upload</button>
        </section>
      </div>
    </section>
  </main>
  <script src="verify.js"></script>
</body>
</html>
